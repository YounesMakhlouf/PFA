version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

    groups:
      pub-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      pub-major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
